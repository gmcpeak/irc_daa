services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: donation-worker
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./assets:/app/assets:ro
      - ./.env:/app/.env:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: donation-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - WORKER_URL=http://worker:8000
    depends_on:
      - worker
    volumes:
      - ./assets:/app/assets:ro
      - ./.env:/app/.env:ro
